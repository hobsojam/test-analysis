name: TQA Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=tqa --cov-report=xml:coverage.xml tests/

      - name: Run mutation tests
        run: mutmut run
        continue-on-error: true

      - name: Export mutation results
        run: mutmut junitxml > mutmut.xml

      - name: Debug reports
        run: |
          echo "=== mutmut.xml (first 20 lines) ==="
          head -20 mutmut.xml || echo "mutmut.xml missing"
          echo "=== coverage.xml file paths ==="
          grep 'filename=' coverage.xml | head -10

      - name: Run TQA
        run: |
          python -m tqa.cli analyze \
            --coverage coverage.xml \
            --mutmut mutmut.xml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.number }} --body-file tqa-summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
