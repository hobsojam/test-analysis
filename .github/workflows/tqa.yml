name: TQA Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=xml:coverage.xml tests/

      - name: Run mutation tests
        run: mutmut run
        continue-on-error: true

      - name: Export mutation results
        run: mutmut junitxml > mutmut.xml

      - name: Run TQA
        run: |
          python -m tqa.cli analyze \
            --coverage coverage.xml \
            --mutmut mutmut.xml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
            --jq '[.[] | select(.user.login == "github-actions" and (.body | startswith("# TQA Report Summary"))) | .id] | last // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/${{ github.repository }}/issues/comments/"$COMMENT_ID" \
              -X PATCH -f body="$(cat tqa-summary.md)"
          else
            gh pr comment ${{ github.event.number }} --body-file tqa-summary.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
