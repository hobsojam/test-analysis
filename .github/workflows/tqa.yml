name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff pip-audit

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Security audit with pip-audit
        run: |
          pip-audit

      - name: Run unit/integration tests
        run: |
          pytest tests/ --cov=tqa --cov-report=xml:coverage.xml

      - name: Verify coverage data was collected
        run: |
          python -c "
          import lxml.etree as ET
          classes = ET.parse('coverage.xml').getroot().xpath('//class')
          assert classes, 'coverage.xml has no file entries — coverage collected no data (check editable install)'
          print(f'coverage.xml OK: {len(classes)} file(s) measured')
          "

      - name: Run mutation tests
        run: mutmut run
        continue-on-error: true

      - name: Export mutation results
        run: mutmut junitxml > mutmut.xml

      - name: Analyze with TQA
        run: |
          python -m tqa.cli analyze \
            --coverage coverage.xml \
            --mutmut mutmut.xml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('tqa-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
