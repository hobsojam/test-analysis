name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff pip-audit

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy tqa/

      - name: Security audit with pip-audit
        run: |
          pip-audit

      - name: Run unit/integration tests
        run: |
          pytest tests/ --cov=tqa --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Verify coverage data was collected
        run: |
          python -c "
          import lxml.etree as ET
          classes = ET.parse('coverage.xml').getroot().xpath('//class')
          assert classes, 'coverage.xml has no file entries — coverage collected no data (check editable install)'
          print(f'coverage.xml OK: {len(classes)} file(s) measured')
          "

      - name: Run mutation tests
        run: mutmut run
        continue-on-error: true

      - name: Export mutation results
        run: mutmut junitxml > mutmut.xml

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutmut.xml

      - name: Analyze with TQA
        run: |
          python -m tqa.cli analyze \
            --config tqa.toml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('tqa-summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.findLast(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('# TQA Report Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary,
              });
            }

  update-sample-output:
    name: Update README sample output
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [quality-and-security]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tqa
        run: pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - uses: actions/download-artifact@v4
        with:
          name: mutation-report

      - name: Generate sample output SVG
        run: |
          python -m tqa.cli analyze \
            --config tqa.toml \
            --export-svg sample-output.svg

      - name: Push SVG to build-artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin build-artifacts
          git checkout build-artifacts
          cp $GITHUB_WORKSPACE/sample-output.svg sample-output.svg
          git add sample-output.svg
          git diff --staged --quiet || git commit -m "update sample output"
          git push origin build-artifacts

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [quality-and-security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
