name: TQA Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=tqa --cov-report=xml:coverage.xml tests/

      - name: Run TQA
        run: |
          # Analyze the generated coverage report
          python -m tqa.cli analyze \
            --coverage coverage.xml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.number }} --body-file tqa-summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
