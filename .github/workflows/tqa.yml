name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tqa/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'tqa.toml'
      - '.github/workflows/tqa.yml'
  push:
    branches: [ main ]
    paths:
      - 'tqa/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'tqa.toml'
      - '.github/workflows/tqa.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  prevent-build-artifacts-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block merge from build-artifacts
        run: |
          if [ "${{ github.head_ref }}" = "build-artifacts" ]; then
            echo "::error::build-artifacts is a CI-only artifact branch. It must never be merged into main."
            exit 1
          fi

  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff pip-audit

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy tqa/

      - name: Security audit with pip-audit
        run: |
          pip-audit

      - name: Run unit/integration tests
        run: |
          pytest tests/ --cov=tqa --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Verify coverage data was collected
        run: |
          python -c "
          import lxml.etree as ET
          classes = ET.parse('coverage.xml').getroot().xpath('//class')
          assert classes, 'coverage.xml has no file entries — coverage collected no data (check editable install)'
          print(f'coverage.xml OK: {len(classes)} file(s) measured')
          "

      - name: Analyze with TQA
        run: |
          python -m tqa.cli analyze \
            --config tqa.toml \
            --format github > tqa-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('tqa-summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.findLast(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## TQA Report Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary,
              });
            }

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [quality-and-security]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
