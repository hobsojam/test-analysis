[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tqa"
version = "0.1.0"
description = "Test Quality Analyzer - Correlate coverage and mutation testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "James Hobson", email = "hobson.james@gmail.com" }
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
    "lxml>=4.9.0",  # Faster XML parsing
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pip-audit>=2.0.0",
    "black>=22.0.0",
    "mutmut>=2.4.0,<3.0.0",
    "mypy>=1.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
tqa = "tqa.cli:main"

[tool.mutmut]
paths_to_mutate = "tqa/"
tests_dir = "tests/"

[tool.coverage.run]
source = ["tqa"]
relative_files = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
