[build-system]
requires = ["setuptools>=83.0.0"]  # PYSEC-2026-3447 fixed in 83.0.0
build-backend = "setuptools.build_meta"

[project]
name = "tqa"
version = "0.1.0"
description = "Test Quality Analyzer - Correlate coverage and mutation testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "James Hobson", email = "hobson.james@gmail.com" }
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
    "lxml>=4.9.0",  # Faster XML parsing
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pip-audit>=2.0.0",
    # Keep mutmut on 2.x: 3.x removed junitxml, which TQA and mutation.yml consume.
    "mutmut>=2.4.0,<4.0.0",
    "mypy>=1.0.0",
    "hypothesis>=6.0.0",
    # Cap below 0.16: it expands the default rule set and flags ~900 pre-existing
    # findings repo-wide. Bump deliberately once those are triaged/fixed.
    "ruff>=0.15.0,<0.17.0",
]

[project.scripts]
tqa = "tqa.cli:main"

[tool.mutmut]
paths_to_mutate = "tqa/"
tests_dir = "tests/"

[tool.coverage.run]
source = ["tqa"]
relative_files = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
